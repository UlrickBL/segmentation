<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monochrome Plan Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f8fafc;
            font-family: sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 75vh;
            background: white;
            border-bottom: 2px solid #000;
        }

        .controls {
            padding: 20px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .log-container {
            background: #000;
            color: #34d399;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
            height: 60px;
            overflow-y: auto;
            width: 90%;
            margin: 0 auto;
        }

        button {
            transition: all 0.1s ease;
            border: 2px solid black;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

    <div id="canvas-container"></div>
    <div id="log" class="log-container">> Technical Monochrome Engine Online.</div>

    <div class="controls">
        <button id="btn-sample" class="bg-white hover:bg-black hover:text-white font-bold py-2 px-8">Generate New
            Plan</button>
        <button id="btn-export" class="bg-white hover:bg-black hover:text-white font-bold py-2 px-8">Export PNG +
            JSON</button>
    </div>

    <script>
        let scene, camera, renderer, buildingGroup;
        let windowObjects = [];
        const container = document.getElementById('canvas-container');

        const COLOR_WALL = 0xffffff;
        const COLOR_LINE = 0x000000;

        function log(msg) {
            const div = document.createElement('div');
            div.innerHTML = `> ${msg}`;
            const logEl = document.getElementById('log');
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);
            camera = new THREE.OrthographicCamera(-10, 10, 10, -10, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 1.5));
            generate();
            animate();
        }

        function createShape(pts, color, z) {
            const shape = new THREE.Shape();
            shape.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length; i++) shape.lineTo(pts[i].x, pts[i].y);
            shape.lineTo(pts[0].x, pts[0].y);

            const group = new THREE.Group();
            const mesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({ color }));
            mesh.position.z = z;
            group.add(mesh);

            const outline = new THREE.LineSegments(
                new THREE.EdgesGeometry(new THREE.ShapeGeometry(shape)),
                new THREE.LineBasicMaterial({ color: COLOR_LINE, linewidth: 2 })
            );
            outline.position.z = z + 0.01;
            group.add(outline);
            return group;
        }

        function generate() {
            if (buildingGroup) scene.remove(buildingGroup);
            buildingGroup = new THREE.Group();
            scene.add(buildingGroup);
            windowObjects = [];

            let cursorX = 0;
            const numSections = 2 + Math.floor(Math.random() * 2);

            for (let i = 0; i < numSections; i++) {
                const w = 5 + Math.random() * 8;
                const h = 3 + Math.random() * 7;
                const z = i * -0.2;

                // Wall section
                const wall = createShape([
                    { x: 0, y: 0 }, { x: w, y: 0 }, { x: w, y: h }, { x: 0, y: h }
                ], COLOR_WALL, z);
                wall.position.set(cursorX, 0, 0);
                buildingGroup.add(wall);

                // Roof (Varied styles)
                const rH = 1.5 + Math.random() * 2.5;
                const isGable = Math.random() > 0.4;
                let roof;
                if (isGable) {
                    roof = createShape([{ x: -0.3, y: 0 }, { x: w + 0.3, y: 0 }, { x: w / 2, y: rH }], COLOR_WALL, z - 0.05);
                } else {
                    roof = createShape([{ x: 0, y: 0 }, { x: w, y: 0 }, { x: w, y: 0.4 }, { x: 0, y: 0.4 }], COLOR_WALL, z - 0.05);
                }
                roof.position.set(cursorX, h, 0);
                buildingGroup.add(roof);

                // Windows
                const rows = Math.max(1, Math.floor(h / 3));
                const cols = Math.max(1, Math.floor(w / 2.5));
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const wx = cursorX + (w / (cols + 1)) * (c + 1);
                        const wy = (h / (rows + 1)) * (r + 1);

                        if (r === 0 && c === Math.floor(cols / 2) && i === 0) {
                            const door = createShape([{ x: -0.8, y: 0 }, { x: 0.8, y: 0 }, { x: 0.8, y: 2.4 }, { x: -0.8, y: 2.4 }], COLOR_WALL, z + 0.05);
                            door.position.set(wx, 0, 0);
                            buildingGroup.add(door);
                        } else {
                            addWindow(wx, wy, 1.2, 1.6, z + 0.05);
                        }
                    }
                }
                cursorX += w;
            }
            fitCamera();
        }

        function addWindow(x, y, w, h, z) {
            const style = Math.random() > 0.8 ? 'arch' : 'rect';
            let geo;
            if (style === 'arch') {
                const s = new THREE.Shape();
                s.moveTo(-w / 2, -h / 2); s.lineTo(w / 2, -h / 2); s.lineTo(w / 2, h / 4);
                s.absarc(0, h / 4, w / 2, 0, Math.PI, false); s.lineTo(-w / 2, -h / 2);
                geo = new THREE.ShapeGeometry(s);
            } else {
                geo = new THREE.PlaneGeometry(w, h);
            }

            const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xffffff }));
            mesh.position.set(x, y, z);
            buildingGroup.add(mesh);

            const outline = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0x000000 }));
            outline.position.set(x, y, z + 0.01);
            buildingGroup.add(outline);

            if (style === 'rect') {
                const ptsH = [new THREE.Vector3(x - w / 2, y, z + 0.02), new THREE.Vector3(x + w / 2, y, z + 0.02)];
                const ptsV = [new THREE.Vector3(x, y - h / 2, z + 0.02), new THREE.Vector3(x, y + h / 2, z + 0.02)];
                buildingGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(ptsH), new THREE.LineBasicMaterial({ color: 0x000000 })));
                buildingGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(ptsV), new THREE.LineBasicMaterial({ color: 0x000000 })));
            }
            windowObjects.push(mesh);
        }

        function fitCamera() {
            const box = new THREE.Box3().setFromObject(buildingGroup);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            const aspect = container.clientWidth / container.clientHeight;
            const viewSize = Math.max(size.x / aspect, size.y) * 1.2;

            camera.left = -viewSize * aspect / 2;
            camera.right = viewSize * aspect / 2;
            camera.top = viewSize / 2;
            camera.bottom = -viewSize / 2;
            camera.position.set(center.x, center.y, 50);
            camera.updateProjectionMatrix();
        }

        function exportFiles() {
            renderer.render(scene, camera);
            const timestamp = Date.now();

            // PNG Export
            const imgData = renderer.domElement.toDataURL("image/png");
            downloadLink(imgData, `elevation_${timestamp}.png`);

            // JSON Export
            const bboxes = windowObjects.map(obj => {
                const box = new THREE.Box3().setFromObject(obj);
                const min = box.min.clone().project(camera);
                const max = box.max.clone().project(camera);
                return {
                    "bbox_2d": [
                        Math.round(((min.x + 1) / 2) * 1000), Math.round(((1 - max.y) / 2) * 1000),
                        Math.round(((max.x + 1) / 2) * 1000), Math.round(((1 - min.y) / 2) * 1000)
                    ],
                    "label": "window"
                };
            });
            const jsonStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(bboxes, null, 2));
            downloadLink(jsonStr, `metadata_${timestamp}.json`);

            log(`Auto-downloaded elevation_${timestamp}.png and metadata.`);
        }

        function downloadLink(url, name) {
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            a.click();
        }

        function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
        window.addEventListener('resize', () => { renderer.setSize(container.clientWidth, container.clientHeight); fitCamera(); });
        document.getElementById('btn-sample').addEventListener('click', generate);
        document.getElementById('btn-export').addEventListener('click', exportFiles);

        init();
    </script>
</body>

</html>
