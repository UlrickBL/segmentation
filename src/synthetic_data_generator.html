<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diverse Elevation Architect</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f3f4f6;
            font-family: 'Inter', sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 70vh;
            background: #ffffff;
            border-bottom: 2px solid #e2e8f0;
        }

        canvas {
            display: block;
        }

        .log-container {
            background: #0f172a;
            color: #38bdf8;
            padding: 15px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 11px;
            height: 100px;
            overflow-y: auto;
            width: 95%;
            margin: 10px auto;
        }

        .controls {
            padding: 10px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
    </style>
</head>

<body>

    <div id="canvas-container"></div>
    <div id="log" class="log-container">> Architect standing by.</div>

    <div class="controls">
        <button id="btn-sample"
            class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition shadow-md">Generate
            Unique Building</button>
        <button id="btn-export"
            class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-lg transition shadow-md">Export
            Data</button>
    </div>

    <script>
        let scene, camera, renderer, buildingGroup;
        let windowObjects = [];
        const container = document.getElementById('canvas-container');

        const PALETTES = [
            { wall: 0xffffff, accent: 0x334155, window: 0xe2e8f0 }, // Modern White
            { wall: 0xfafaf9, accent: 0x78350f, window: 0xd6d3d1 }, // Warm Farmhouse
            { wall: 0x475569, accent: 0x0f172a, window: 0x94a3b8 }, // Industrial Slate
            { wall: 0xfee2e2, accent: 0x991b1b, window: 0xffffff }  // Classic Brickish
        ];

        function log(msg) {
            const logEl = document.getElementById('log');
            const entry = document.createElement('div');
            entry.innerHTML = `> ${msg}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);
            camera = new THREE.OrthographicCamera(-10, 10, 10, -10, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);
            scene.add(new THREE.AmbientLight(0xffffff, 1.2));
            generate();
            animate();
        }

        function createShape(pts, color, z, outlineColor = 0x000000) {
            const shape = new THREE.Shape();
            shape.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length; i++) shape.lineTo(pts[i].x, pts[i].y);
            shape.lineTo(pts[0].x, pts[0].y);

            const group = new THREE.Group();
            const mesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({ color }));
            mesh.position.z = z;
            group.add(mesh);

            const edges = new THREE.LineSegments(
                new THREE.EdgesGeometry(new THREE.ShapeGeometry(shape)),
                new THREE.LineBasicMaterial({ color: outlineColor, linewidth: 2 })
            );
            edges.position.z = z + 0.01;
            group.add(edges);
            return group;
        }

        function generate() {
            if (buildingGroup) scene.remove(buildingGroup);
            buildingGroup = new THREE.Group();
            scene.add(buildingGroup);
            windowObjects = [];

            const palette = PALETTES[Math.floor(Math.random() * PALETTES.length)];
            let cursorX = 0;

            // --- 1. GENERATE VOLUMES ---
            const sections = [];
            const numSections = 2 + Math.floor(Math.random() * 2); // 2 to 3 main volumes

            for (let i = 0; i < numSections; i++) {
                const width = 4 + Math.random() * 6;
                const height = 3 + Math.random() * 9;
                const z = i * -0.5; // Layering

                sections.push({ x: cursorX, w: width, h: height, z: z });

                // Wall
                const wall = createShape([
                    { x: 0, y: 0 }, { x: width, y: 0 }, { x: width, y: height }, { x: 0, y: height }
                ], palette.wall, z, palette.accent);
                wall.position.set(cursorX, 0, 0);
                buildingGroup.add(wall);

                // --- 2. ROOFS ---
                const rH = 1.5 + Math.random() * 3;
                const roofType = Math.random() > 0.4 ? 'gable' : 'flat';
                if (roofType === 'gable') {
                    const roof = createShape([
                        { x: -0.5, y: 0 }, { x: width + 0.5, y: 0 }, { x: width / 2, y: rH }
                    ], 0xffffff, z - 0.1, 0x000000);
                    roof.position.set(cursorX, height, 0);
                    buildingGroup.add(roof);
                } else {
                    const slab = createShape([
                        { x: -0.2, y: 0 }, { x: width + 0.2, y: 0 }, { x: width + 0.2, y: 0.4 }, { x: -0.2, y: 0.4 }
                    ], palette.accent, z + 0.1, 0x000000);
                    slab.position.set(cursorX, height, 0);
                    buildingGroup.add(slab);
                }

                // --- 3. WINDOWS & DOORS ---
                const rows = Math.max(1, Math.floor(height / 3.5));
                const cols = Math.max(1, Math.floor(width / 2.5));
                const winStyle = Math.random() > 0.6 ? 'arch' : 'rect';

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const winW = 1.2, winH = 1.6;
                        const wx = cursorX + (width / (cols + 1)) * (c + 1);
                        const wy = (height / (rows + 1)) * (r + 1);

                        // Randomly skip window for a door on ground floor
                        if (r === 0 && c === Math.floor(cols / 2) && i === 0) {
                            const door = createShape([
                                { x: -0.7, y: 0 }, { x: 0.7, y: 0 }, { x: 0.7, y: 2.2 }, { x: -0.7, y: 2.2 }
                            ], palette.accent, z + 0.2, 0x000000);
                            door.position.set(wx, 0, 0);
                            buildingGroup.add(door);
                        } else {
                            addWindow(wx, wy, winW, winH, winStyle, z + 0.2, palette.window);
                        }
                    }
                }
                cursorX += width;
            }

            // --- 4. DETAILS (Chimney) ---
            if (Math.random() > 0.5) {
                const chimney = createShape([{ x: 0, y: 0 }, { x: 1.2, y: 0 }, { x: 1.2, y: 3 }, { x: 0, y: 3 }], palette.accent, -2);
                chimney.position.set(sections[0].x + 1, sections[0].h, 0);
                buildingGroup.add(chimney);
            }

            fitCamera();
            log("Generated diverse multi-volume structure.");
        }

        function addWindow(x, y, w, h, type, z, color) {
            let geo = (type === 'arch') ? new THREE.CircleGeometry(w / 2, 32) : new THREE.PlaneGeometry(w, h);
            // Arch geometry adjustment
            if (type === 'arch') {
                const s = new THREE.Shape();
                s.moveTo(-w / 2, -h / 2); s.lineTo(w / 2, -h / 2); s.lineTo(w / 2, h / 4);
                s.absarc(0, h / 4, w / 2, 0, Math.PI, false); s.lineTo(-w / 2, -h / 2);
                geo = new THREE.ShapeGeometry(s);
            }

            const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color }));
            mesh.position.set(x, y, z);
            buildingGroup.add(mesh);

            const frame = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0x000000 }));
            frame.position.set(x, y, z + 0.01);
            buildingGroup.add(frame);
            windowObjects.push(mesh);
        }

        function fitCamera() {
            const box = new THREE.Box3().setFromObject(buildingGroup);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            const aspect = container.clientWidth / container.clientHeight;
            const viewSize = Math.max(size.x / aspect, size.y) * 1.2;

            camera.left = -viewSize * aspect / 2;
            camera.right = viewSize * aspect / 2;
            camera.top = viewSize / 2;
            camera.bottom = -viewSize / 2;
            camera.position.set(center.x, center.y, 50);
            camera.updateProjectionMatrix();
        }

        function exportFiles() {
            renderer.render(scene, camera);

            // 1. Capture a single timestamp to use for BOTH files
            const exportId = Date.now();

            const img = renderer.domElement.toDataURL("image/png");
            const bboxes = windowObjects.map(obj => {
                const box = new THREE.Box3().setFromObject(obj);
                const min = box.min.clone().project(camera);
                const max = box.max.clone().project(camera);
                return {
                    "bbox_2d": [
                        Math.round(((min.x + 1) / 2) * 1000),
                        Math.round(((1 - max.y) / 2) * 1000),
                        Math.round(((max.x + 1) / 2) * 1000),
                        Math.round(((1 - min.y) / 2) * 1000)
                    ],
                    "label": "window"
                };
            });

            const dl = (u, n) => {
                const a = document.createElement('a');
                a.href = u;
                a.download = n;
                a.click();
            };

            // 2. Use the exact same exportId for both filenames
            dl(img, `elevation_${exportId}.png`);
            dl("data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(bboxes)), `meta_${exportId}.json`);

            log(`Exported set ID: ${exportId}`);
        }

        function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
        document.getElementById('btn-sample').addEventListener('click', generate);
        document.getElementById('btn-export').addEventListener('click', exportFiles);
        window.addEventListener('resize', () => {
            renderer.setSize(container.clientWidth, container.clientHeight);
            fitCamera();
        });

        init();
    </script>
</body>

</html>
